[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mixture-instrument-factory"
version = "0.1.0"
description = "Stemless cued mixture-to-playable-instrument pipeline; honest capability boundaries"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
[project.optional-dependencies]
audio = ["numpy>=1.24", "soundfile>=0.12"]
test = ["pytest>=7"]
[project.scripts]
mix2vst = "mix2vst.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
